# Assistant du site lamine.mlndao.fr — configuration Cloudflare Worker
# Déploiement : voir chatbot/README.md

name = "lamine-chat"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# API publique sur https://lamine-chat.mlndao.workers.dev ; pas d'URL de prévisualisation
workers_dev = true
preview_urls = false

# knowledge.md est importé tel quel (texte) dans le Worker
rules = [{ type = "Text", globs = ["**/*.md"], fallthrough = true }]

[vars]
MODEL = "gpt-4.1-mini"
# pages autorisées à appeler l'API (localhost : tests locaux, python -m http.server ou Live Server)
ALLOWED_ORIGINS = "https://lamine.mlndao.fr,http://localhost:8000,http://127.0.0.1:8000,http://localhost:5500,http://127.0.0.1:5500"

# 15 questions par minute et par adresse IP, au-delà : message poli d'attente
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 15, period = 60 }

# La clé OpenAI n'est JAMAIS écrite ici : npx wrangler secret put OPENAI_API_KEY
