lead_fr: Apprentissage automatique pour les données multivariées et multi-capteurs issues de systèmes industriels, avec l'objectif de rendre les modèles interprétables et robustes.
lead_en: Machine learning for multivariate, multi-sensor data from industrial systems, with a focus on making models interpretable and robust.
topics:
- title_fr: Évaluation des méthodes d'XAI
  title_en: Evaluating XAI methods
  text_fr: Évaluation quantitative des explications post-hoc (SHAP, LIME, L2X) et de l'effet du prétraitement et de la complexité des modèles.
  text_en: Quantitative evaluation of post-hoc explanations (SHAP, LIME, L2X) and of how preprocessing and model complexity change them.
- title_fr: Réduction de dimension interprétable
  title_en: Interpretable dimension reduction
  text_fr: Clustering divisif de variables et clustering autour de composantes latentes, pour construire des entrées lisibles pour les modèles de RUL.
  text_en: Divisive feature clustering and clustering of variables around latent components, used to build readable inputs for RUL models.
- title_fr: Maintenance prédictive
  title_en: Predictive maintenance
  text_fr: Prédiction de la RUL à partir de séries temporelles multi-capteurs (turboréacteurs C-MAPSS, roulements PRONOSTIA / FEMTO-ST) avec des modèles profonds (LSTM).
  text_en: RUL prediction from multi-sensor time series (C-MAPSS turbofans, PRONOSTIA / FEMTO-ST bearings) with deep models such as LSTMs.
- title_fr: Données hétérogènes
  title_en: Heterogeneous data
  text_fr: Clustering multi-blocs et multi-vues, consensus de partitions et données manquantes.
  text_en: Multi-block and multi-view clustering, consensus clustering and missing data.
