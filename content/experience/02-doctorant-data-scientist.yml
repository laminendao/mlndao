text_fr: Prédiction de la RUL à partir de données multi-capteurs (C-MAPSS, PRONOSTIA) avec des LSTM ; explicabilité avec LIME, SHAP et L2X ; sélection non supervisée de variables par clustering divisif ; analyse bibliométrique de la littérature XAI (web scraping, LDA).
